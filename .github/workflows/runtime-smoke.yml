name: Core runtime smoke
on:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC_THINGZ_REQUIRED_CLIS: claude,codex,pi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: scripts/setup/install-agbun.sh
      - name: Install core runtimes
        run: |
          npm ci --prefix tests/vendor-smoke
          echo "$GITHUB_WORKSPACE/tests/vendor-smoke/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check runtime versions
        run: |
          claude --version
          codex --version
          pi --version
      - run: make check-generated
      - name: Exercise packaged core runtimes
        run: >-
          uv run --extra test python -m pytest tests/test_agentbundler_release.py
          -k 'claude_release_hooks or pi_release_archive or (marketplace_registers and (claude or codex))'
          -v
      - name: Exercise generated hook adapters
        run: uv run --extra test python -m pytest tests/test_agentbundler_hooks.py -v
      - name: Load Pi extensions and skills
        run: >-
          uv run --extra test python -m pytest
          tests/test_root_compatibility.py::test_repository_root_pi_package_loads_commands_from_local_path -v
