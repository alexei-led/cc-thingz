name: Core runtime smoke
on:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC_THINGZ_REQUIRED_CLIS: claude,codex,pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: .agentbundler-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/vendor-smoke/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: scripts/setup/install-agbun.sh
      - name: Install core runtimes
        run: |
          npm ci --prefix tests/vendor-smoke
          echo "$GITHUB_WORKSPACE/tests/vendor-smoke/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check runtime versions
        run: |
          claude --version
          codex --version
          pi --version
      - run: make check-generated
      - name: Exercise packaged runtimes, adapters, and Pi loading
        run: >-
          uv run --extra test python -m pytest
          tests/test_agentbundler_release.py tests/test_agentbundler_hooks.py
          tests/test_root_compatibility.py::test_repository_root_pi_package_loads_commands_from_local_path
          -k 'claude_release_hooks or pi_release_archive or (marketplace_registers and (claude or codex)) or test_agentbundler_hooks or loads_commands_from_local_path'
          -v --durations=10
