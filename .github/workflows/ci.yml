name: CI
on:
  push:
    branches:
      - master
      - main
    tags-ignore:
      - v*
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      shell: ${{ steps.filter.outputs.shell }}
      markdown: ${{ steps.filter.outputs.markdown }}
      config: ${{ steps.filter.outputs.config }}
      skill_evals: ${{ steps.filter.outputs.skill_evals }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
            shell:
              - '**/*.sh'
              - '**/*.bats'
              - 'scripts/git-hooks/*'
              - 'scripts/release/release-tag'
              - '.shellcheckrc'
              - '.github/workflows/**'
            markdown:
              - '**/*.md'
              - '.markdownlint.yaml'
              - '.github/workflows/**'
            config:
              - '**/*.json'
              - '**/*.toml'
              - 'agentbundle.json'
              - '.agentbundler-version'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'src/**'
              - 'src/.agentbundler/**'
              - 'dist/**'
              - 'Makefile'
            skill_evals:
              - 'src/skills/**'
              - 'dist/**'
              - 'tests/skill-evals/**'
              - 'scripts/evals/prepare-skill-evals.py'
              - 'scripts/evals/summarize-skill-evals.py'
              - 'docs/skill-eval*.md'
              - 'Makefile'
              - '.node-version'
            typescript:
              - 'src/plugins/**/*.ts'
              - 'tests/pi-extensions/**/*.ts'
              - 'package.json'
              - 'tsconfig.json'
              - 'bun.lock'
              - 'Makefile'
              - '.github/workflows/**'
  lint-shell:
    name: Lint Shell
    needs: changes
    if: needs.changes.outputs.shell == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        env:
          SHFMT_OPTS: -i 0
      - name: Install Bats
        run: scripts/setup/install-bats.sh "$RUNNER_TEMP/bats"
      - name: Run shell integration tests
        run: make test-shell
  lint-markdown:
    name: Lint Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !**/node_modules/**
  test:
    name: Python tests and package validation
    needs: changes
    if: needs.changes.outputs.config == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.skill_evals == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache-dependency-path: .agentbundler-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Install Agent Bundler
        run: |
          scripts/setup/install-agbun.sh
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint-python validate check-generated skill-evals-prepare test
  test-typescript:
    name: TypeScript lint and tests
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: make lint-typescript test-ts
  skill-evals:
    name: Skill Evals
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.skill_evals == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SKILL_EVAL_WORKSPACE: /tmp/skill-evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Run advisory skill evals
        run: |
          set +e
          make skill-evals \
            SKILL_EVAL_LOG_FORMAT=jsonl \
            SKILL_EVAL_CONCURRENCY=8 \
            SKILL_EVAL_STRICT=0 \
            SKILL_EVAL_REPORT="$SKILL_EVAL_WORKSPACE/summary.md"
          status=$?
          if [ -f "$SKILL_EVAL_WORKSPACE/summary.md" ]; then
            cat "$SKILL_EVAL_WORKSPACE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Skill eval report"
              echo ""
              echo "No summary was produced. Check the job logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Skill evals failed in advisory mode. See the job summary and artifact."
          fi
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: skill-eval-report
          path: ${{ env.SKILL_EVAL_WORKSPACE }}
          if-no-files-found: ignore
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  runtime-smoke:
    uses: ./.github/workflows/runtime-smoke.yml
  ci-success:
    name: CI Success
    needs:
      - changes
      - lint-shell
      - lint-markdown
      - test
      - test-typescript
      - secrets
      - runtime-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: |
          results="$JOB_RESULTS"
          if echo "$results" | grep -qE '"result": "(failure|cancelled)"'; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed or were skipped"
